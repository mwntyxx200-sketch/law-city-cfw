<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAW CITY CFW | الدليل الرسمي للقوانين والبروتوكولات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Cairo -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050b14;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
        }
        .tab-active-citizen {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .tab-active-military {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- رأس الصفحة / الهوية -->
    <header class="glass-panel border-b border-slate-800 sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- الشعار والاسم -->
            <div class="flex items-center gap-3">
                <div class="p-3 bg-gradient-to-tr from-indigo-600 to-violet-700 rounded-2xl text-white shadow-lg shadow-indigo-500/20">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-indigo-400">LAW CITY CFW</h1>
                    <p class="text-xs text-slate-400 font-semibold">بوابة القوانين والإرشادات الرسمية للأعضاء</p>
                </div>
            </div>

            <!-- شريط البحث السريع -->
            <div class="relative w-full md:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterRules()" placeholder="ابحث عن قانون، بند، أو كود..." 
                       class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pr-10 pl-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6">

        <!-- أزرار التبديل الرئيسية (القسمين الأساسيين) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button onclick="switchSection('citizens')" id="btn-citizens" class="tab-active-citizen p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-blue-500/30">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-white/10 rounded-xl text-white">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <div class="text-right">
                        <h2 class="font-bold text-sm">قسم المواطنين، العصابات والوظائف</h2>
                        <p class="text-[11px] text-blue-100/80">قوانين الرول بلاي العامة، السرقات، والمرور</p>
                    </div>
                </div>
                <i data-lucide="chevron-left" class="w-5 h-5 text-white/70 group-hover:-translate-x-1 transition-transform"></i>
            </button>

            <button onclick="switchSection('military')" id="btn-military" class="glass-panel p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-slate-800 hover:border-emerald-500/40">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-emerald-500/10 rounded-xl text-emerald-400">
                        <i data-lucide="shield-alert" class="w-6 h-6"></i>
                    </div>
                    <div class="text-right">
                        <h2 class="font-bold text-sm text-slate-200">قسم العساكر والأمن</h2>
                        <p class="text-[11px] text-slate-400">أكواد اللاسلكي، البرتوكولات، وحقوق المحتجزين</p>
                    </div>
                </div>
                <i data-lucide="chevron-left" class="w-5 h-5 text-slate-500 group-hover:-translate-x-1 transition-transform"></i>
            </button>
        </div>

        <!-- أزرار التصنيفات الفرعية (تتغير ديناميكياً حسب القسم المختار) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="sub-categories-bar"></div>

        <!-- حاوية عرض القوانين والبنود -->
        <div id="rules-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </main>

    <!-- تذييل الصفحة -->
    <footer class="glass-panel border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة © LAW CITY CFW 2026 - نظام القوانين والإرشادات الداخلية
    </footer>

    <!-- سكريبت التشغيل والبيانات -->
    <script>
        // بيانات القوانين والأنظمة الخاصة بالسيرفر
        const database = {
            citizens: [
                { id: 1, cat: 'rp', catName: 'أنظمة الرول بلاي', code: 'CFW-RP-01', title: 'قدسية وحماية الحياة (Value Your Life)', desc: 'يتوجب عليك الانصياع الفوري والتجاوب الكامل عند الوقوع تحت تهديد السلاح المباشر لحماية حياتك وعدم تعريضها للخطر العشوائي.', severity: 'high' },
                { id: 2, cat: 'rp', catName: 'أنظمة الرول بلاي', code: 'CFW-RP-02', title: 'القتل غير المبرر (RDM)', desc: 'يمنع الاستهداف بالقتل أو إطلاق النار على أي مواطن دون بناء سيناريو متكامل ودوافع رول بلاي واضحة.', severity: 'high' },
                { id: 3, cat: 'rp', catName: 'أنظمة الرول بلاي', code: 'CFW-RP-03', title: 'الاعتداء بالمركبات (VDM)', desc: 'يحظر استخدام المركبات كأداة هجومية أو صدم المواطنين والأمن بأسلوب غير واقعي.', severity: 'high' },
                { id: 4, cat: 'rp', catName: 'أنظمة الرول بلاي', code: 'CFW-RP-04', title: 'كسر واقعية المدينة (Fail RP)', desc: 'يمنع استغلال معلومات المدى الخارجي أو القيام بأفعال تتنافى مع منطق الواقع داخل السيرفر.', severity: 'medium' },
                
                { id: 5, cat: 'criminal', catName: 'قانون السرقات والجرائم', code: 'LAW-CR-01', title: 'السطو على المركزي والمؤسسات المالية', desc: 'العقوبة: السجن 150 شهر + غرامة 45,000$ مع مصادرة العتاد المستخدم بالكامل.', severity: 'high' },
                { id: 6, cat: 'criminal', catName: 'قانون السرقات والجرائم', code: 'LAW-CR-02', title: 'اختطاف رجال الأمن أثناء أداء الواجب', desc: 'العقوبة: السجن 90 شهر + غرامة 25,000$ (كفالة غير متاحة في هذا البند).', severity: 'high' },
                { id: 7, cat: 'criminal', catName: 'قانون السرقات والجرائم', code: 'LAW-CR-03', title: 'حيازة أسلحة ثقيلة غير مرخصة (Class-3)', desc: 'العقوبة: السجن 45 شهر + غرامة 15,000$ ومصادرة السلاح.', severity: 'medium' },

                { id: 8, cat: 'traffic', catName: 'قوانين المرور والمركبات', code: 'TRF-01', title: 'تجاوز السرعة القانونية داخل النطاق العمراني', desc: 'العقوبة: غرامة مالية قدرها 1,500$ + تسجيل إنذار مروري على السجل.', severity: 'low' },
                { id: 9, cat: 'traffic', catName: 'قوانين المرور والمركبات', code: 'TRF-02', title: 'القيادة بدون رخصة قيادة سارية', desc: 'العقوبة: غرامة 3,000$ مع حجز المركبة لمدة 10 دقائق.', severity: 'low' }
            ],
            military: [
                { id: 10, cat: 'codes', catName: 'أكواد اللاسلكي', code: 'CODE-0', title: 'نداء حالة الطوارئ القصوى (Code 0)', desc: 'توجيه كافة الوحدات الأمنية فوراً وإلغاء جميع البلاغات الثانوية للانتقال للموقع وتأمينه.', severity: 'high' },
                { id: 11, cat: 'codes', catName: 'أكواد اللاسلكي', code: '10-20', title: 'تحديد الموقع الحالي للوحدة / الهدف', desc: 'الصيغة المعتمدة: [رقم الوحدة] - [10-20] - [اسم المنطقة أو الشارع المعني].', severity: 'low' },
                { id: 12, cat: 'codes', catName: 'أكواد اللاسلكي', code: '10-80', title: 'مطاردة مركبة في حالة فرار', desc: 'الصيغة: [رقم الوحدة] - [10-80] - [نوع المركبة، اللون، اتجاه الحركة السرعة].', severity: 'medium' },
                { id: 13, cat: 'codes', catName: 'أكواد اللاسلكي', code: '10-99', title: 'تعرض ضابط لإطلاق نار مباشر', desc: 'استجابة سريعة فورية من أقرب دوريتين مع تفعيل أجهزة الإنذار والطلب العاجل للاسعاف.', severity: 'high' },

                { id: 14, cat: 'protocols', catName: 'بروتوكولات الأمن والتعامل', code: 'PRT-01', title: 'حقوق المتهم أثناء الاحتجاز (ميراندا)', desc: 'يجب تلاوة الحقوق فور التكبيل للمتهم: (لك الحق في الصمت، وكل ما تقوله سيستخدم ضدك...)', severity: 'medium' },
                { id: 15, cat: 'protocols', catName: 'بروتوكولات الأمن والتعامل', code: 'PRT-02', title: 'بروتوكول التعامل مع الرهائن والأزمات', desc: 'سلامة الرهينة هي الأولوية المطلقة قبل الشروع بأي اقتحام أو مفاوضة مع الخاطفين.', severity: 'high' },
                { id: 16, cat: 'protocols', catName: 'بروتوكولات الأمن والتعامل', code: 'PRT-03', title: 'سلم استخدام القوة الميدانية', desc: 'التدرج الميداني: الإنذار الصوتي -> استخدام العصا/الصاعق -> الأسلحة النارية عند الخطر المميت.', severity: 'high' }
            ]
        };

        let currentSection = 'citizens';
        let currentSubCat = 'all';

        function switchSection(section) {
            currentSection = section;
            currentSubCat = 'all';

            const btnCitizens = document.getElementById('btn-citizens');
            const btnMilitary = document.getElementById('btn-military');

            if (section === 'citizens') {
                btnCitizens.className = 'tab-active-citizen p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-blue-500/30';
                btnMilitary.className = 'glass-panel p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-slate-800 hover:border-emerald-500/40';
            } else {
                btnMilitary.className = 'tab-active-military p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-emerald-500/30';
                btnCitizens.className = 'glass-panel p-4 rounded-2xl flex items-center justify-between transition-all group cursor-pointer border border-slate-800 hover:border-blue-500/40';
            }

            renderSubCategories();
            renderRules();
        }

        function renderSubCategories() {
            const container = document.getElementById('sub-categories-bar');
            const items = database[currentSection];
            
            // استخراج التصنيفات الفرعية الفريدة
            const catsMap = new Map();
            items.forEach(i => catsMap.set(i.cat, i.catName));

            let html = `<button onclick="filterBySubCat('all')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all shrink-0 ${currentSubCat === 'all' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'glass-panel text-slate-400 hover:text-white'}">الكل</button>`;
            
            catsMap.forEach((name, key) => {
                const isActive = currentSubCat === key;
                html += `<button onclick="filterBySubCat('${key}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all shrink-0 ${isActive ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'glass-panel text-slate-400 hover:text-white'}">${name}</button>`;
            });

            container.innerHTML = html;
        }

        function filterBySubCat(catKey) {
            currentSubCat = catKey;
            renderSubCategories();
            renderRules();
        }

        function filterRules() {
            renderRules();
        }

        function renderRules() {
            const container = document.getElementById('rules-grid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            let items = database[currentSection];

            if (currentSubCat !== 'all') {
                items = items.filter(i => i.cat === currentSubCat);
            }

            if (query) {
                items = items.filter(i => i.code.toLowerCase().includes(query) || i.title.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query));
            }

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-slate-500 font-bold glass-panel rounded-2xl">لا توجد نتائج مطابقة لبحثك الحالي.</div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const isHigh = item.severity === 'high';
                const isMed = item.severity === 'medium';
                const sevBadgeClass = isHigh ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : (isMed ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-sky-500/10 text-sky-400 border-sky-500/30');
                const sevText = isHigh ? 'عقوبة قصوى / جنائية' : (isMed ? 'مخالفة متوسطة' : 'إرشادي / تنظيمي');

                return `
                <div class="glass-panel p-5 rounded-2xl space-y-3 hover:border-slate-700 transition-all glow-effect">
                    <div class="flex items-center justify-between">
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${item.code}</span>
                        <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-bold border ${sevBadgeClass}">${sevText}</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-white mb-1">${item.title}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">${item.desc}</p>
                    </div>
                </div>`;
            }).join('');
        }

        // التهيئة عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            switchSection('citizens');
        });
    </script>
</body>
</html>
