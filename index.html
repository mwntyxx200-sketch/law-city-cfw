<!DOCTYPE html>
<html lang="ar" dir="rtl" class="theme-default text-size-md">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAW CITY CFW | القوانين والبروتوكولات الرسمية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        
        .theme-default {
            --bg-main: #020617;
            --bg-card: rgba(15, 23, 42, 0.8);
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            transition: background-color 0.3s ease;
        }

        .custom-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            backdrop-filter: blur(12px);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
        }

        .filter-btn-active {
            background-color: #312e81 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        @media print {
            aside, header, .no-print, nav.mobile-bottom-nav { display: none !important; }
            main { width: 100% !important; margin: 0 !important; }
            body { background: #fff !important; color: #000 !important; }
            .custom-card { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col md:flex-row relative overflow-x-hidden pb-20 md:pb-0">

    <!-- إشعار التنبيهات -->
    <div id="copy-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-slate-100 border border-indigo-500/40 px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3 text-xs font-bold transition-all duration-300 opacity-0 pointer-events-none -translate-y-6">
        <div class="p-1.5 bg-indigo-500/20 text-indigo-400 rounded-lg">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        </div>
        <span id="toast-msg">تمت العملية بنجاح!</span>
    </div>

    <!-- Sidebar القائمة الجانبية -->
    <aside id="sidebar-panel" class="hidden md:flex w-72 bg-slate-900 border-l border-slate-800 p-5 flex-col justify-between shrink-0 z-20">
        <div class="space-y-6">
            <!-- الشعار -->
            <div class="flex items-center gap-3 px-2">
                <div class="p-3 bg-gradient-to-tr from-indigo-600 via-indigo-700 to-violet-800 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-300">LAW CITY CFW</h1>
                    <p class="text-[11px] font-bold text-slate-400" id="user-role-badge">الوظيفة: مواطن</p>
                </div>
            </div>

            <!-- قائمة التبويبات والتصنيفات -->
            <nav class="space-y-1.5 overflow-y-auto max-h-[calc(100vh-280px)] pr-1" id="sidebar-nav">
                <button type="button" onclick="switchTab('all')" id="btn-all" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-amber-400 bg-amber-500/10 border border-amber-500/20 cursor-pointer">
                    <span class="text-base">📋</span>
                    جميع القوانين والأنظمة
                </button>

                <button type="button" onclick="switchTab('favorites')" id="btn-favorites" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-yellow-400 hover:bg-slate-800 cursor-pointer">
                    <span class="text-base">⭐</span>
                    المفضلة
                </button>

                <button type="button" onclick="switchTab('official-links')" id="btn-official-links" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-cyan-400 hover:bg-slate-800 cursor-pointer">
                    <span class="text-base">🔗</span>
                    الروابط الرسمية
                </button>

                <hr class="border-slate-800 my-2">

                <div id="dynamic-categories-nav" class="space-y-1.5"></div>

                <hr class="border-slate-800 my-2">

                <div id="manager-tools" class="hidden space-y-1.5">
                    <button type="button" onclick="switchTab('audit-logs')" id="btn-audit-logs" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 cursor-pointer">
                        <span class="text-base">📜</span>
                        سجلات التعديلات (اللوقات)
                    </button>

                    <button type="button" onclick="openManageCatsModal()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-purple-300 bg-purple-600/10 hover:bg-purple-600/20 border border-purple-500/30 cursor-pointer">
                        <span class="flex items-center gap-2">
                            <span class="text-base">⚙️</span>
                            إدارة التصنيفات والإيموجي
                        </span>
                        <span class="text-[9px] px-1.5 py-0.5 bg-purple-500/20 rounded text-purple-300 font-black">MANAGER</span>
                    </button>

                    <button type="button" onclick="switchTab('manager-panel')" id="btn-manager-panel" class="nav-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 cursor-pointer">
                        <span class="flex items-center gap-2">
                            <span class="text-base">👑</span>
                            إدارة الحسابات
                        </span>
                        <span class="text-[9px] px-1.5 py-0.5 bg-amber-500/20 rounded text-amber-300 font-extrabold">MANAGER</span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span>المستخدم الحالي:</span>
                <span id="current-user-name" class="font-bold text-white">مواطن</span>
            </div>
            
            <button type="button" id="visitor-view-toggle" onclick="toggleVisitorPerspective()" class="hidden w-full py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i> معاينة بمنظور الزائر
            </button>

            <!-- زر تسجيل الدخول الآمن والواضح -->
            <button type="button" id="auth-btn" onclick="openAuthModal()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-bold rounded-lg text-white border border-indigo-500 transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 cursor-pointer">
                <i data-lucide="log-in" class="w-4 h-4"></i> تسجيل الدخول
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-30 glass-header border-b border-slate-800/80 px-4 md:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full max-w-lg">
                <i data-lucide="search" class="w-5 h-5 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث باسم القانون، الكود، البروتوكول e.g. 10-20, السطو..." 
                       class="w-full bg-slate-900/90 border border-slate-700/60 rounded-xl pr-11 pl-10 py-2.5 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <button type="button" id="add-cat-btn" onclick="openAddCatModal()" class="hidden bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-purple-600/30 cursor-pointer">
                    <span class="text-sm">➕</span> تصنيف جديد
                </button>
                <button type="button" id="add-rule-btn" onclick="openAddRuleModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/30 cursor-pointer">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> إضافة بند جديد
                </button>
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-6 flex-1 overflow-y-auto">
            <div id="filter-bar-section" class="space-y-3 custom-card p-4 rounded-2xl border">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i> اختصارات سريعة LAW CITY CFW:
                    </span>
                </div>
                
                <div class="flex flex-wrap gap-2 text-xs font-bold" id="popular-tags">
                    <button type="button" onclick="togglePopularTag(this, 'سطو')" class="tag-btn px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 transition-all cursor-pointer">#السطو والجرائم</button>
                    <button type="button" onclick="togglePopularTag(this, '10-20')" class="tag-btn px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 transition-all cursor-pointer">#الموقع_10-20</button>
                    <button type="button" onclick="togglePopularTag(this, 'CODE-0')" class="tag-btn px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 transition-all cursor-pointer">#كود_زيرو</button>
                    <button type="button" onclick="togglePopularTag(this, 'الحياة')" class="tag-btn px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 transition-all cursor-pointer">#تقدير_الحياة</button>
                </div>

                <div class="flex items-center gap-2 pt-3 border-t border-slate-800/80 overflow-x-auto pb-1 text-xs font-bold">
                    <span class="text-slate-400 shrink-0">مستوى العقوبة:</span>
                    <button type="button" id="sev-high" onclick="toggleSeverity('high')" class="sev-filter-btn shrink-0 px-3 py-1.5 bg-slate-900 text-rose-400 border border-rose-500/30 rounded-xl transition-all cursor-pointer">🔴 عقوبة قصوى / جنائية</button>
                    <button type="
