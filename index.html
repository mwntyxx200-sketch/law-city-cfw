<!DOCTYPE html>
<html lang="ar" dir="rtl" class="theme-default text-size-md">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAW CITY CFW | القوانين والبروتوكولات الرسمية</title>
    
    <!-- وسوم المعاينة لـ ديسكورد (Discord Open Graph Meta Tags) -->
    <meta property="og:title" content="LAW CITY CFW - القوانين والأنظمة الرسمية" />
    <meta property="og:description" content="البوابة الرسمية لقوانين وأنظمة مدينة Law City CFW، سجل الآن بحساب ديسكورد الخاص بك وتصفح الأنظمة." />
    <meta property="og:url" content="https://law-city-cfw.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        
        .theme-default {
            --bg-main: #020617;
            --bg-card: rgba(15, 23, 42, 0.8);
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            transition: background-color 0.3s ease;
        }

        .custom-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            backdrop-filter: blur(12px);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
        }

        .filter-btn-active {
            background-color: #312e81 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        @media print {
            aside, header, .no-print, nav.mobile-bottom-nav { display: none !important; }
            main { width: 100% !important; margin: 0 !important; }
            body { background: #fff !important; color: #000 !important; }
            .custom-card { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col md:flex-row relative overflow-x-hidden pb-20 md:pb-0">

    <!-- إشعار التنبيهات -->
    <div id="copy-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-slate-100 border border-indigo-500/40 px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3 text-xs font-bold transition-all duration-300 opacity-0 pointer-events-none -translate-y-6">
        <div class="p-1.5 bg-indigo-500/20 text-indigo-400 rounded-lg">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        </div>
        <span id="toast-msg">تمت العملية بنجاح!</span>
    </div>

    <!-- Sidebar القائمة الجانبية -->
    <aside id="sidebar-panel" class="hidden md:flex w-72 bg-slate-900 border-l border-slate-800 p-5 flex-col justify-between shrink-0 z-20">
        <div class="space-y-6">
            <!-- الشعار -->
            <div class="flex items-center gap-3 px-2">
                <div class="p-3 bg-gradient-to-tr from-indigo-600 via-indigo-700 to-violet-800 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-300">LAW CITY CFW</h1>
                    <p class="text-[11px] font-bold text-slate-400" id="user-role-badge">الوظيفة: مواطن</p>
                </div>
            </div>

            <!-- قائمة التبويبات والتصنيفات -->
            <nav class="space-y-1.5 overflow-y-auto max-h-[calc(100vh-280px)] pr-1" id="sidebar-nav">
                <button onclick="switchTab('all')" id="btn-all" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-amber-400 bg-amber-500/10 border border-amber-500/20">
                    <span class="text-base">📋</span>
                    جميع القوانين والأنظمة
                </button>

                <button onclick="switchTab('favorites')" id="btn-favorites" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-yellow-400 hover:bg-slate-800">
                    <span class="text-base">⭐</span>
                    المفضلة
                </button>

                <button onclick="switchTab('official-links')" id="btn-official-links" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-cyan-400 hover:bg-slate-800">
                    <span class="text-base">🔗</span>
                    الروابط الرسمية
                </button>

                <hr class="border-slate-800 my-2">

                <!-- تصنيفات القوانين الديناميكية -->
                <div id="dynamic-categories-nav" class="space-y-1.5"></div>

                <hr class="border-slate-800 my-2">

                <!-- أدوات خاصة بالمنجر والأدمن -->
                <div id="manager-tools" class="hidden space-y-1.5">
                    <button onclick="switchTab('audit-logs')" id="btn-audit-logs" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20">
                        <span class="text-base">📜</span>
                        سجلات التعديلات (اللوقات)
                    </button>

                    <button onclick="openManageCatsModal()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-purple-300 bg-purple-600/10 hover:bg-purple-600/20 border border-purple-500/30">
                        <span class="flex items-center gap-2">
                            <span class="text-base">⚙️</span>
                            إدارة التصنيفات والإيموجي
                        </span>
                        <span class="text-[9px] px-1.5 py-0.5 bg-purple-500/20 rounded text-purple-300 font-black">MANAGER</span>
                    </button>

                    <button onclick="switchTab('manager-panel')" id="btn-manager-panel" class="nav-btn w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold transition-all text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20">
                        <span class="flex items-center gap-2">
                            <span class="text-base">👑</span>
                            إدارة الحسابات
                        </span>
                        <span class="text-[9px] px-1.5 py-0.5 bg-amber-500/20 rounded text-amber-300 font-extrabold">MANAGER</span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span>المستخدم الحالي:</span>
                <span id="current-user-name" class="font-bold text-white">زائر (غير مسجل)</span>
            </div>
            
            <!-- زر معاينة الزائر (يظهر للمنجر والأدمن فقط) -->
            <button id="visitor-view-toggle" onclick="toggleVisitorPerspective()" class="hidden w-full py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i> معاينة بمنظور الزائر
            </button>

            <!-- زر تسجيل الدخول عبر ديسكورد الموحد -->
            <a href="https://discord.com/api/oauth2/authorize?client_id=1556667547376418837&redirect_uri=https://law-city-cfw.vercel.app/&response_type=token&scope=identify%20guilds" class="w-full py-2 bg-[#5865F2] hover:bg-[#4752C4] text-xs font-bold rounded-lg text-white transition-all flex items-center justify-center gap-2 shadow-lg shadow-[#5865F2]/30">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                تسجيل الدخول بـ Discord
            </a>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-30 glass-header border-b border-slate-800/80 px-4 md:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full max-w-lg">
                <i data-lucide="search" class="w-5 h-5 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث باسم القانون، الكود، البروتوكول e.g. 10-20, السطو..." 
                       class="w-full bg-slate-900/90 border border-slate-700/60 rounded-xl pr-11 pl-10 py-2.5 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-6 flex-1 overflow-y-auto">
            <div class="custom-card p-6 rounded-2xl border text-center space-y-3">
                <h2 class="text-xl font-bold text-indigo-400">مرحباً بك في منصة Law City CFW</h2>
                <p class="text-xs text-slate-300">استخدم زر "تسجيل الدخول بـ Discord" في القائمة الجانبية لتوحيد حسابك في جميع منصاتنا بسلاسة.</p>
            </div>
        </div>
    </
